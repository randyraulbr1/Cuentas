name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create persistent test signing key
        run: |
          mkdir -p test-signing
          if [ ! -f test-signing/debug.keystore ]; then
            keytool -genkeypair -v -keystore test-signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=305 Save Test,O=305 Save,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p ../downloads
          cp app/build/outputs/apk/debug/app-debug.apk ../downloads/305-Save-prueba.apk

      - name: Upload workflow copy
        uses: actions/upload-artifact@v4
        with:
          name: 305-Save-prueba
          path: downloads/305-Save-prueba.apk
          retention-days: 30

      - name: Publish direct test download
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/305-Save-prueba.apk mobile/test-signing/debug.keystore
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest 305 Save test APK"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main && break
              git rebase --abort || true
              sleep 5
            done
            git push
          fi
