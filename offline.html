<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>305 Save</title>
<meta name="theme-color" content="#0A0A0A" />
<link rel="icon" href="icon-192.png" />
<style>
  :root{ --bg:#F5F5F5; --card-bg:#FFFFFF; --text:#0A0A0A; --text-muted:#6B6B6B; --border:#E2E2E2; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#050505; --card-bg:#121212; --text:#F2F2F2; --text-muted:#8A8A8A; --border:#262626; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter",Arial,sans-serif;
    padding:24px;
  }
  .card{ max-width:360px; text-align:center; }
  .icon{ width:56px; height:56px; margin:0 auto 18px; opacity:.85; }
  h1{ font-size:20px; font-weight:800; margin:0 0 8px; }
  p{ font-size:14.5px; color:var(--text-muted); line-height:1.5; margin:0 0 24px; }
  button{
    background:var(--text); color:var(--bg); border:none; border-radius:12px;
    padding:14px 28px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  button:active{ opacity:.8; }
  .note{ margin-top:16px; font-size:12px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 9a16 16 0 0 1 22 0"/><path d="M5 13a10 10 0 0 1 14 0"/><path d="M9 17a4 4 0 0 1 6 0"/><line x1="2" y1="2" x2="22" y2="22"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Tus datos guardados están a salvo en el teléfono — vuelve a intentar cuando tengas señal o wifi.</p>
    <button onclick="location.reload()">Reintentar</button>
    <div class="note">305 Save</div>
  </div>
</body>
</html>
