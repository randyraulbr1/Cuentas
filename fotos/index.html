<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Receiving</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--text:#2a2220;--muted:#9a8c78;--blue:#c8102e;--green:#c8102e;--red:#c8102e;--gold:#a98f5b;--line:#e6dcc8}
@media(prefers-color-scheme:dark){:root{--bg:#140c0e;--card:#211416;--text:#f5eee0;--muted:#a8997f;--line:#3d2c2a;--gold:#c4a96d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
h1,.head b,.grp .top b{font-family:'Cormorant Garamond',Didot,'Bodoni 72',Georgia,serif}
main{padding:env(safe-area-inset-top) 16px calc(170px + env(safe-area-inset-bottom))}
h1{font-size:30px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:var(--gold);text-align:center;margin:26px 0 22px;padding-bottom:30px;position:relative}
h1:after{content:'';position:absolute;left:50%;bottom:-6px;width:34px;height:34px;transform:translateX(-50%) rotate(45deg) scale(.45);background:var(--blue);border-radius:30% 30% 30% 30%;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--gold)}
.card{background:var(--card);border-radius:18px;padding:14px 16px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(120,90,40,.08);margin-bottom:14px}
label.t{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
input[type=text]{width:100%;border:0;background:transparent;font-size:19px;color:var(--text);outline:none;padding:4px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:600;color:#fff;background:var(--blue);cursor:pointer;transition:transform .1s,opacity .2s;margin-bottom:14px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btn.wa{background:var(--blue);margin:0;letter-spacing:.3px}
.btn.red{background:var(--card);color:var(--red);border:1px solid var(--line);box-shadow:0 2px 10px rgba(120,90,40,.08)}
.head{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px}
.head b{font-size:20px}.head button{background:none;border:0;color:var(--gold);font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--line);animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.chk{position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.ph.on .chk{background:var(--blue);border-color:var(--blue)}
.del{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px}
.bd{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;background:var(--gold)}
.bd.ok{background:var(--blue)}
.ph.sent img{opacity:.75}
.empty{text-align:center;color:var(--muted);padding:40px 10px}.empty .big{color:var(--gold);opacity:.6}.empty .big .ic{width:64px;height:64px;stroke-width:1.2}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.send{padding:12px 16px 4px;display:flex;gap:10px}
.send .btn{flex:1;height:58px;margin:0;padding:0 8px;font-size:17px;letter-spacing:.3px}
.camb{background:var(--gold)!important}
.tabs{display:flex}.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--muted);font-size:11px;cursor:pointer}
.tabs button span{font-size:22px}.tabs button.on{color:var(--blue)}
.tabs button{letter-spacing:.5px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-100px);background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:20px;transition:transform .3s;z-index:30;font-size:15px}
.toast.show{transform:translateX(-50%)}
.grp{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(120,90,40,.08)}
.grp .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.grp .top b{font-size:18px}.grp .top small{color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto}.strip img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.opt:last-child{border:0}
select{font-size:16px;border:0;background:var(--bg);color:var(--text);padding:8px 10px;border-radius:10px}
.sw{position:relative;width:51px;height:31px;flex:none}.sw input{display:none}
.sw i{position:absolute;inset:0;background:#c7c7cc;border-radius:16px;transition:.2s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i:after{transform:translateX(20px)}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#cam.show{display:flex}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .ctl{height:130px;display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);background:#000}
#shut{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0;position:relative}
#shut:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:transform .1s}
#shut:active:after{transform:scale(.85)}
#done{background:var(--blue);color:#fff;border:0;border-radius:20px;padding:10px 20px;font-size:17px;font-weight:600}
#flip,#count{width:72px;color:#fff;font-size:15px;text-align:center;background:none;border:0}
#flip{font-size:30px}
#strip{position:absolute;left:0;right:0;bottom:140px;display:flex;gap:6px;padding:0 12px;overflow-x:auto}
#strip img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:2px solid #fff;flex:none;animation:pop .25s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .25s}@keyframes fl{from{opacity:.8}to{opacity:0}}
input[type=file]{display:none}
.logo{display:block;max-width:230px;max-height:110px;margin:22px auto -6px;object-fit:contain}
.logo+h1{margin-top:12px}
.opt input[type=text]{text-align:right;width:55%;font-size:16px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#dlg.show{display:flex}
#dlg .bx{background:var(--card);border-radius:20px;padding:22px 20px 16px;width:100%;max-width:320px;text-align:center;border:1px solid var(--line);animation:pop .2s}
#dlg b{font-family:'Cormorant Garamond',Didot,Georgia,serif;font-size:22px;display:block;margin-bottom:6px}
#dlg p{margin:0 0 16px;color:var(--muted)}
#dlg .r{display:flex;gap:10px}#dlg .r .btn{margin:0;padding:13px 0;font-size:16px;flex:1}
#dlg .btn.no{background:var(--bg);color:var(--text)}
.ic{width:22px;height:22px;flex:none}
.tabs button span{display:flex;justify-content:center;margin-bottom:2px}
.tabs .ic{width:25px;height:25px}
#flip .ic{width:30px;height:30px}
#mdl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:45}
#mdl.show{display:flex}
#mdl .bx{background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:80vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#mdl h3{font-family:'Cormorant Garamond',Didot,Georgia,serif;font-size:24px;font-weight:500;margin:0 0 12px;text-align:center;color:var(--gold)}
.pk{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--bg);color:var(--text);font-size:18px;padding:14px 16px;border-radius:14px;margin-bottom:8px;text-align:left}
.pk.on{background:var(--blue);color:#fff}
.who{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.who span{font-size:20px}.who .ph0{color:var(--muted)}
.who svg{width:18px;height:18px;color:var(--gold)}
.row2{display:flex;gap:8px;margin-bottom:12px}
.row2 input{flex:1;background:var(--bg);border-radius:12px;padding:12px;font-size:17px}
.row2 .btn{width:auto;margin:0;padding:0 18px;font-size:16px}
.emp{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.emp button{background:none;border:0;color:var(--blue);font-size:15px}
#splash,#busy{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
#splash{background:var(--bg)}
#busy{background:rgba(20,12,14,.55);z-index:60;display:none;color:#fff;font-size:17px}
#busy.show{display:flex}
#splash.out{opacity:0;pointer-events:none}
#splash .lg{width:104px;height:104px;border-radius:26px;box-shadow:0 8px 24px rgba(120,6,28,.35)}
#splash .lg svg{width:48px;height:48px}
#splash h2{margin:0;font-family:'Cormorant Garamond',Didot,Georgia,serif;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:var(--gold);font-size:24px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp .8s linear infinite}
#busy .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.net{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.net.off{background:#6e6259;color:#fff}.net.q{background:var(--blue);color:#fff}
.net button{background:#fff;color:var(--blue);border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px;border-radius:10px;font-size:14px;font-weight:600}
.seg button i{font-style:normal;font-size:12px;margin-left:5px;background:var(--bg);color:var(--text);border-radius:9px;padding:1px 7px}
.seg button.on{background:var(--blue);color:#fff}.seg button.on i{background:rgba(255,255,255,.25);color:#fff}
.grp.bad{border-color:var(--blue)}.mot{color:var(--blue);font-size:14px;margin:-4px 0 10px}
</style></head><body>
<div id="splash"><img class="lg" src="icon-192.png" alt=""><h2 id="sptit">Receiving</h2><div class="spin"></div></div>
<div id="busy"><div class="spin"></div><span id="btxt">Preparando…</span></div>
<main id="m"></main>
<div class="dock"><div class="send" id="sendbox"><button class="btn wa" id="send" disabled>Compartir</button><button class="btn camb" id="bcam" aria-label="Abrir cámara"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.6"/></svg>Cámara</button></div>
<div class="tabs"><button data-t="fotos"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.6"/></svg></span>Fotos</button><button data-t="hist"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></span>Historial</button><button data-t="opc"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Opciones</button></div></div>
<div id="cam"><video id="vid" playsinline muted autoplay></video><div id="flash"></div><div id="strip"></div>
<div class="ctl"><div id="count">0</div><button id="shut" aria-label="Foto"></button><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><button id="flip"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3.5h3.5"/><path d="M4 13a8 8 0 0 0 14.9 3M20 19v-3.5h-3.5"/></svg></button><button id="done">Listo</button></div></div></div>
<input id="flogo" type="file" accept="image/*">
<input id="fcam" type="file" accept="image/*" capture="environment">
<div id="mdl"><div class="bx" id="mbx"></div></div>
<div id="dlg"><div class="bx"><b>¿Borrar esta foto?</b><p>No se puede deshacer.</p><div class="r"><button class="btn no" id="dno">Cancelar</button><button class="btn" id="dyes">Sí, borrar</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const S=JSON.parse(localStorage.getItem('cfg')||'{}');
const cfg=Object.assign({nombre:'',calidad:1600,titulo:'Receiving',camara:'environment',vibrar:true,auto:true,volver:true,wlink:'',wabrir:true,empleados:[],nombreTs:0},S);
const save=()=>localStorage.setItem('cfg',JSON.stringify(cfg));
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(tab==='opc')draw()});
addEventListener('appinstalled',()=>{dip=null;toast('App instalada ✓');if(tab==='opc')draw()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const CLK='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>';let hTab='pend';
let db,photos=[],hist=[],urls={},tab='fotos',stream=null,session=0;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('fotos',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('p'))d.createObjectStore('p',{keyPath:'id'});if(!d.objectStoreNames.contains('h'))d.createObjectStore('h',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(st,m,f)=>new Promise((res,rej)=>{const t=db.transaction(st,m);const r=f(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
const blobOf=(src,w,h,max,q)=>new Promise(res=>{const s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',q)});
const thumb=blob=>new Promise(res=>{const i=new Image(),u=URL.createObjectURL(blob);i.onload=()=>{const s=Math.min(1,160/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.6))};i.src=u});
async function addBlob(b){await tx('p','readwrite',s=>s.put({id:Date.now()+Math.random(),blob:b,on:true}));await load()}
async function fromFile(f){const i=new Image(),u=URL.createObjectURL(f);await new Promise(r=>{i.onload=r;i.onerror=r;i.src=u});const b=i.width?await blobOf(i,i.width,i.height,cfg.calidad,.85):f;URL.revokeObjectURL(u);await addBlob(b)}
async function load(){photos=(await tx('p','readonly',s=>s.getAll())||[]).sort((a,b)=>a.id-b.id);hist=(await tx('h','readonly',s=>s.getAll())||[]).sort((a,b)=>b.id-a.id);draw()}
function draw(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('sendbox').style.display=tab==='fotos'?'':'none';
 const n=photos.filter(p=>p.on).length;
 $('send').disabled=!n;$('send').textContent=n?`Compartir (${n})`:'Compartir';
 const m=$('m');
 if(tab==='fotos'){
  m.innerHTML=`${cfg.logo?`<img class="logo" src="${cfg.logo}">`:''}<h1>${esc(cfg.titulo||'Receiving')}</h1>${netBar()}<div class="card who" id="who"><div><label class="t">Tu nombre</label><span class="${cfg.nombre?'':'ph0'}">${cfg.nombre?esc(cfg.nombre):'Selecciona tu nombre'}</span></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
  <div class="head"><b>${photos.length?`${photos.length} foto${photos.length>1?'s':''} · ${n} seleccionada${n!=1?'s':''}`:'Sin fotos'}</b>${photos.length?`<button id="all">${n===photos.length?'Quitar todas':'Seleccionar todas'}</button>`:''}</div>
  ${photos.length?'<div class="grid" id="grid"></div>':'<div class="empty"><div class="big"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.6"/></svg></div>Abre la cámara y toma las fotos.<br>Cada foto se guarda sola, sin internet.</div>'}`;
  $('who').onclick=pickName;if($('nsend'))$('nsend').onclick=enviar;
  if($('all'))$('all').onclick=async()=>{const v=!photos.every(p=>p.on);for(const p of photos){p.on=v;await tx('p','readwrite',s=>s.put(p))}draw()};
  const g=$('grid');if(g)photos.forEach(p=>{const u=urls[p.id]||(urls[p.id]=URL.createObjectURL(p.blob));const d=document.createElement('div');d.className='ph'+(p.on?' on':'');d.innerHTML=`<img src="${u}"><div class="chk">${p.on?'✓':''}</div><span class="bd">${p.q?'En cola':'Pendiente'}</span><button class="del">✕</button>`;
   d.onclick=async e=>{if(e.target.classList.contains('del')){e.stopPropagation();pedir(async()=>{await tx('p','readwrite',s=>s.delete(p.id));URL.revokeObjectURL(urls[p.id]);delete urls[p.id];load();toast('Foto borrada')});return}p.on=!p.on;await tx('p','readwrite',s=>s.put(p));draw()};g.appendChild(d)});
 }else if(tab==='hist'){
  const ok=hist.filter(h=>h.estado!=='error'),er=hist.filter(h=>h.estado==='error');
  const okN=ok.reduce((a,h)=>a+h.n,0),erN=er.reduce((a,h)=>a+h.n,0);
  const fmt=id=>new Date(id).toLocaleString('es',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  const grp=(h,bad)=>`<div class="grp${bad?' bad':''}"><div class="top"><b>${esc(h.nombre||'Sin nombre')}</b><small>${fmt(h.id)} · ${h.n} foto${h.n>1?'s':''}</small></div>${bad&&h.motivo?`<div class="mot">${esc(h.motivo)}</div>`:''}<div class="strip">${h.thumbs.map(t=>`<img src="${t}">`).join('')}</div></div>`;
  const empty=(t,x)=>`<div class="empty"><div class="big">${t}</div>${x}</div>`;
  let body;
  if(hTab==='pend')body=photos.length?`<div class="grid">${photos.map(p=>{const u=urls[p.id]||(urls[p.id]=URL.createObjectURL(p.blob));return`<div class="ph"><img src="${u}"><span class="bd">${p.q?'En cola':'Pendiente'}</span></div>`}).join('')}</div>`:empty(CLK,'No hay fotos pendientes.');
  else if(hTab==='env')body=ok.length?ok.map(h=>grp(h,false)).join(''):empty(CLK,'Aquí verás cada envío agrupado con el nombre de quien lo mandó.');
  else body=er.length?er.map(h=>grp(h,true)).join(''):empty(CLK,'Sin errores.');
  m.innerHTML=`<h1>Historial</h1><div class="seg"><button data-h="pend" class="${hTab==='pend'?'on':''}">Pendientes<i>${photos.length}</i></button><button data-h="env" class="${hTab==='env'?'on':''}">Enviadas<i>${okN}</i></button><button data-h="err" class="${hTab==='err'?'on':''}">Errores<i>${erN}</i></button></div>${body}`;
  m.querySelectorAll('.seg button').forEach(x=>x.onclick=()=>{hTab=x.dataset.h;draw()});
 }else{
  m.innerHTML=`<h1>Opciones</h1><div class="card">
  <div class="opt"><span>Perfil</span><button class="btn" id="oprf" style="display:inline-flex;width:auto;padding:8px 14px;font-size:15px;margin:0">${cfg.nombre?esc(cfg.nombre):'Elegir'}</button></div>
  <div class="opt"><span>Administrador</span><button class="btn" id="oadm" style="display:inline-flex;width:auto;padding:8px 14px;font-size:15px;margin:0;background:var(--gold)">Entrar</button></div>
  <div class="opt"><span>Link del grupo de WhatsApp</span></div>
  <div class="opt" style="border:0;padding-top:0"><input type="text" id="ow" placeholder="https://chat.whatsapp.com/..." inputmode="url" style="text-align:left;width:100%;background:var(--bg);border-radius:12px;padding:11px 12px;font-size:15px"></div>
  <div class="opt"><span>Abrir el grupo después de compartir</span><label class="sw"><input type="checkbox" id="oa"><i></i></label></div>
  <div class="opt"><span>Título</span><input type="text" id="o5" placeholder="Receiving"></div>
  <div class="opt"><span>Logo</span><span><button class="btn" id="lg" style="display:inline-flex;width:auto;padding:8px 14px;font-size:15px;margin:0">Elegir</button> ${cfg.logo?'<button class="btn red" id="lgx" style="display:inline-flex;width:auto;padding:8px 14px;font-size:15px;margin:0 0 0 6px">Quitar</button>':''}</span></div>
  <div class="opt"><span>Calidad de foto</span><select id="o1"><option value="1000">Baja (rápida)</option><option value="1600">Media</option><option value="2600">Alta</option></select></div>
  <div class="opt"><span>Cámara</span><select id="o2"><option value="environment">Trasera</option><option value="user">Frontal</option></select></div>
  <div class="opt"><span>Vibrar al tomar foto</span><label class="sw"><input type="checkbox" id="o3"><i></i></label></div>
  <div class="opt"><span>Volver tras cada foto</span><label class="sw"><input type="checkbox" id="o6"><i></i></label></div>
  <div class="opt"><span>Fotos nuevas seleccionadas</span><label class="sw"><input type="checkbox" id="o4"><i></i></label></div></div>
  <button class="btn" id="inst" ${standalone()?'disabled':''}>${standalone()?'Abierta como app ✓':'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg> Instalar en el teléfono'}</button>
  <div id="iosh" class="card" style="display:none;line-height:1.7"></div>`;
  $('inst').onclick=async()=>{
   if(dip){dip.prompt();await dip.userChoice;dip=null;return}
   const h=$('iosh');h.style.display='block';
   h.innerHTML=isIOS()?'<b>En iPhone / iPad:</b><br>1. Abre este link en <b>Safari</b>.<br>2. Toca el botón Compartir <b>⬆️</b> (abajo).<br>3. Elige <b>Añadir a pantalla de inicio</b>.<br>4. Toca <b>Añadir</b>.':'<b>En Android:</b><br>1. Abre este link en <b>Chrome</b>.<br>2. Toca el menú <b>⋮</b> (arriba a la derecha).<br>3. Elige <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.'};
  $('ow').value=cfg.wlink;$('ow').oninput=e=>{cfg.wlink=e.target.value.trim();save()};$('oa').checked=cfg.wabrir;$('oa').onchange=e=>{cfg.wabrir=e.target.checked;save()};
  $('oprf').onclick=pickName;$('oadm').onclick=adminLogin;
  $('o5').value=cfg.titulo;$('o5').oninput=e=>{cfg.titulo=e.target.value;save()};
  $('lg').onclick=()=>$('flogo').click();if($('lgx'))$('lgx').onclick=()=>{delete cfg.logo;save();draw()};
  $('o1').value=cfg.calidad;$('o2').value=cfg.camara;$('o3').checked=cfg.vibrar;$('o4').checked=cfg.auto;$('o6').checked=cfg.volver;$('o6').onchange=e=>{cfg.volver=e.target.checked;save()};
  $('o1').onchange=e=>{cfg.calidad=+e.target.value;save()};$('o2').onchange=e=>{cfg.camara=e.target.value;save()};
  $('o3').onchange=e=>{cfg.vibrar=e.target.checked;save()};$('o4').onchange=e=>{cfg.auto=e.target.checked;save()};
 }
}
function pedir(fn,t,sub,lbl){const d=$('dlg');d.querySelector('b').textContent=t||'¿Borrar esta foto?';d.querySelector('p').style.display=(t&&!sub)?'none':'';d.querySelector('p').textContent=sub||'No se puede deshacer.';d.classList.add('show');$('dno').onclick=()=>d.classList.remove('show');$('dyes').onclick=()=>{d.classList.remove('show');fn()};$('dyes').textContent=lbl||(t?'Sí, quitar':'Sí, borrar');d.onclick=e=>{if(e.target===d)d.classList.remove('show')}}
function modal(html,bind){const m=$('mdl');$('mbx').innerHTML=html;m.classList.add('show');m.onclick=e=>{if(e.target===m)m.classList.remove('show')};bind&&bind(()=>m.classList.remove('show'))}
function vencido(ts){const d=new Date(),b=new Date(d);b.setHours(2,0,0,0);if(d<b)b.setDate(b.getDate()-1);return ts<b.getTime()}
function revisa2am(){if(cfg.nombre&&vencido(cfg.nombreTs)){cfg.nombre='';cfg.nombreTs=0;save();if(!stream)draw()}}
function setName(n){cfg.nombre=n;cfg.nombreTs=Date.now();save();draw()}
function pickName(){
 const l=cfg.empleados;
 modal(`<h3>¿Quién eres?</h3>${l.length?l.map((n,i)=>`<button class="pk${n===cfg.nombre?' on':''}" data-i="${i}">${esc(n)}${n===cfg.nombre?'<span>✓</span>':''}</button>`).join(''):'<p style="text-align:center;color:var(--muted)">Todavía no hay nombres.<br>Pide al administrador que los agregue en Opciones.</p>'}`,close=>{
  document.querySelectorAll('#mbx .pk').forEach(b=>b.onclick=()=>{setName(l[+b.dataset.i]);close();toast('Hola, '+l[+b.dataset.i])})})}
function adminLogin(){
 modal(`<h3>Administrador</h3><div class="row2"><input type="password" id="apw" inputmode="numeric" placeholder="Contraseña" autocomplete="off"><button class="btn" id="aok">Entrar</button></div>`,close=>{
  const go=()=>{if($('apw').value==='1010'){adminPanel()}else{toast('Contraseña incorrecta');$('apw').value=''}};
  $('aok').onclick=go;$('apw').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('apw').focus(),150)})}
function adminPanel(){
 modal(`<h3>Empleados</h3><div class="row2"><input type="text" id="anew" placeholder="Nombre nuevo" autocomplete="off"><button class="btn" id="aadd">Agregar</button></div>${cfg.empleados.length?cfg.empleados.map((n,i)=>`<div class="emp"><span>${esc(n)}</span><button data-i="${i}">Quitar</button></div>`).join(''):'<p style="text-align:center;color:var(--muted)">Sin empleados todavía.</p>'}<button class="btn red" id="aclh" style="margin:16px 0 0">Borrar historial de envíos</button><button class="btn red" id="aclp" style="margin:10px 0 0">Vaciar fotos pendientes</button>`,close=>{
  $('aclp').onclick=()=>pedir(async()=>{await tx('p','readwrite',s=>s.clear());photos.forEach(p=>URL.revokeObjectURL(urls[p.id]));urls={};await load();toast('Pendientes vaciadas')},'¿Vaciar fotos pendientes?','Se borrarán '+photos.length+' foto(s) que aún no se enviaron. No se puede deshacer.','Sí, vaciar');
  $('aclh').onclick=()=>pedir(async()=>{await tx('h','readwrite',s=>s.clear());await load();toast('Historial borrado')},'¿Borrar todo el historial?','Se borrarán todos los envíos y sus fotos. No se puede deshacer.','Sí, borrar todo');
  const add=()=>{const v=$('anew').value.trim();if(!v)return;if(cfg.empleados.some(x=>x.toLowerCase()===v.toLowerCase())){toast('Ya existe');return}cfg.empleados.push(v);cfg.empleados.sort((a,b)=>a.localeCompare(b));save();adminPanel();draw()};
  $('aadd').onclick=add;$('anew').onkeydown=e=>{if(e.key==='Enter')add()};
  document.querySelectorAll('#mbx .emp button').forEach(b=>b.onclick=()=>{const n=cfg.empleados[+b.dataset.i];pedir(()=>{cfg.empleados.splice(+b.dataset.i,1);if(cfg.nombre===n){cfg.nombre='';cfg.nombreTs=0}save();adminPanel();draw()},'¿Quitar a '+n+'?')})})}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('bcam').onclick=openCam;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();scrollTo(0,0)});
// ---- cámara: cada toque guarda al instante ----
async function openCam(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('fcam').click();return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cfg.camara},width:{ideal:2560},height:{ideal:1440}},audio:false});}
 catch(e){toast('Sin permiso de cámara');$('fcam').click();return}
 $('vid').srcObject=stream;session=0;$('count').textContent='0';$('strip').innerHTML='';$('cam').classList.add('show');
}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('cam').classList.remove('show');load()}
$('shut').onclick=async()=>{
 const v=$('vid');if(!v.videoWidth)return;
 $('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');
 if(cfg.vibrar&&navigator.vibrate)navigator.vibrate(30);
 const b=await blobOf(v,v.videoWidth,v.videoHeight,cfg.calidad,.85);
 await tx('p','readwrite',s=>s.put({id:Date.now()+Math.random(),blob:b,on:cfg.auto}));
 $('count').textContent=++session;
 const im=new Image();im.src=URL.createObjectURL(b);$('strip').appendChild(im);
 if(cfg.volver){setTimeout(closeCam,350);return}
 load();
};
$('done').onclick=closeCam;
$('flip').onclick=()=>{cfg.camara=cfg.camara==='user'?'environment':'user';save();if(stream)stream.getTracks().forEach(t=>t.stop());openCam()};
$('flogo').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,500/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cfg.logo=c.toDataURL('image/png');save();URL.revokeObjectURL(u);draw();toast('Logo guardado ✓')};i.src=u;e.target.value=''};
$('fcam').onchange=async e=>{for(const f of e.target.files)await fromFile(f);e.target.value='';toast('Foto guardada ✓')};
// ---- compartir ----
const busy=(on,t)=>{$('btxt').textContent=t||'Preparando…';$('busy').classList.toggle('show',on)};
function netBar(){
 if(tab!=='fotos')return'';
 const q=photos.filter(p=>p.q).length;
 if(!navigator.onLine)return`<div class="net off"><span>Sin conexión${q?` · ${q} en cola`:''}</span></div>`;
 if(q)return`<div class="net q"><span>Hay conexión · ${q} foto${q>1?'s':''} en cola</span><button id="nsend">Enviar ahora</button></div>`;
 return'';
}
async function logErr(nombre,sel,motivo){const thumbs=[];for(const p of sel)thumbs.push(await thumb(p.blob));await tx('h','readwrite',s=>s.put({id:Date.now(),nombre,n:sel.length,thumbs,estado:'error',motivo}));await load()}
async function enviar(){
 const nombre=cfg.nombre.trim();
 if(!nombre){toast('Selecciona tu nombre primero');pickName();return}
 const sel=photos.filter(p=>p.on||p.q);
 if(!sel.length)return;
 if(!navigator.onLine){
  for(const p of sel){p.q=true;p.on=true;await tx('p','readwrite',s=>s.put(p))}
  draw();toast('Sin internet: quedó en cola');return}
 const base=nombre.replace(/[^\w]+/g,'_');
 const files=sel.map((p,i)=>new File([p.blob],`${base}_${i+1}.jpg`,{type:'image/jpeg'}));
 const data={files,text:`📸 ${nombre} — ${files.length} foto${files.length>1?'s':''}`};
 try{
  if(navigator.canShare&&navigator.canShare({files}))await navigator.share(data);
  else{await logErr(nombre,sel,'Este navegador no puede enviar fotos directo');if(cfg.wlink)window.open(cfg.wlink,'_blank');else window.open('https://wa.me/?text='+encodeURIComponent(data.text),'_blank');toast('Este navegador no envía fotos directo');return}
 }catch(e){if(e.name==='AbortError')return;await logErr(nombre,sel,'No se pudo compartir: '+(e.message||e.name));toast('No se pudo compartir');return}
 busy(true,'Guardando envío…');
 const thumbs=[];for(const p of sel)thumbs.push(await thumb(p.blob));
 await tx('h','readwrite',s=>s.put({id:Date.now(),nombre,n:sel.length,thumbs}));
 for(const p of sel){await tx('p','readwrite',s=>s.delete(p.id));URL.revokeObjectURL(urls[p.id]);delete urls[p.id]}
 await load();busy(false);toast('Enviado ✓ Lista vacía');
 if(cfg.wlink&&cfg.wabrir)setTimeout(()=>window.open(cfg.wlink,'_blank'),600);
}
$('send').onclick=enviar;
addEventListener('offline',()=>draw());
addEventListener('online',()=>{draw();const q=photos.filter(p=>p.q).length;if(q){toast('Hay conexión: '+q+' en cola');try{if(window.Notification&&Notification.permission==='granted')new Notification('Receiving',{body:q+' foto(s) listas para enviar'})}catch(e){}}});
revisa2am();setInterval(revisa2am,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)revisa2am()});
open().then(d=>{db=d;return load()}).then(()=>{$('sptit').textContent=cfg.titulo||'Receiving';setTimeout(()=>{$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),500)},600);if(photos.some(p=>p.q)&&navigator.onLine&&window.Notification&&Notification.permission==='default')Notification.requestPermission()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
